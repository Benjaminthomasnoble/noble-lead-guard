# Lead Guard relay (Cloudflare Worker). Cloudflare Workers Builds deploys it from this folder on pushes to main.
# The API key and other secrets are set in the Cloudflare dashboard, never in this file.
name = "noble-lead-guard-relay"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
# Keep anything added in the dashboard (like BLOCKED_SITES) when deploying.
keep_vars = true

# Per-site limit: 30 checks a minute is far above any real contact form.
[[ratelimits]]
name = "SITE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Password tries on /admin, per IP.
[[ratelimits]]
name = "ADMIN_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }
